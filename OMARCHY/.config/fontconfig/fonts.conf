<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <alias>
        <family>GeistMono Nerd Font</family>
        <prefer>
            <family>Vazir Code</family>
        </prefer>
    </alias>

    <alias>
        <family>monospace</family>
        <prefer>
            <family>GeistMono Nerd Font</family>
            <family>Vazir Code</family>
        </prefer>
    </alias>

</fontconfig>
